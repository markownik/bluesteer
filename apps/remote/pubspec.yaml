name: bluesteer_remote
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  app_links: ^7.2.2
  bluesteer_protocol_dart:
    path: ../../packages/bluesteer_protocol_dart
  device_info_plus: ^13.3.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  mobile_scanner: ^7.4.2
  universal_ble: ^3.1.2
  xterm: ^4.0.0

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# dart run flutter_launcher_icons   (assets/icon/*.png come from ../../assets/icon via tools/render-icon.swift)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/icon/adaptive-foreground.png"
