name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: swift build -c release
        working-directory: tools
      - name: Test protocol package
        run: swift test
        working-directory: packages/BlueSteerProtocol
      - name: Test host (HostCore, RemoteCore, in-process soak)
        run: swift test
        working-directory: apps/host
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Cross-language SecureChannel interop
        run: tools/interop-test.sh

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Test protocol package
        run: dart pub get && dart test
        working-directory: packages/bluesteer_protocol_dart
      - name: Analyze and test remote
        run: flutter pub get && flutter analyze && flutter test
        working-directory: apps/remote

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install protoc plugins
        run: |
          sudo apt-get install -y protobuf-compiler
          dart pub global activate protoc_plugin
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          # protoc-gen-swift must match the swift-protobuf the packages resolve (Package.resolved).
          curl -fsSL https://github.com/apple/swift-protobuf/releases/download/1.39.0/protoc-gen-swift-linux-x86_64.tar.gz | sudo tar xz -C /usr/local/bin
      - name: Check generated code is current
        run: tools/gen-proto.sh --check
